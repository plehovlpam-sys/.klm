<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Phone Frame</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .phone-frame {
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="phone-frame" viewBox="0 0 400 800" xmlns="http://www.w3.org/2000/svg">
            <!-- Сначала вставляем твою рамку (main.svg) -->
            <image href="main.svg" x="0" y="0" width="100%" height="100%" />
            
            <!-- Затем вставляем контент (белый фон) внутрь экрана -->
            <!-- Нужно подогнать координаты под твою рамку! -->
            <foreignObject x="25" y="60" width="350" height="700">
                <div xmlns="http://www.w3.org/1999/xhtml" style="
                    width: 100%;
                    height: 100%;
                    background: white;
                    overflow: hidden;
                    border-radius: 2px;
                ">
                    <!-- СЮДА МОЖНО ДОБАВИТЬ ЛЮБОЙ HTML-КОНТЕНТ -->
                </div>
            </foreignObject>
        </svg>
    </div>
</body>
</html>
