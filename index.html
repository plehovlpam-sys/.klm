<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Phone Frame</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .phone-frame {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .phone-frame img {
            width: 100%;
            height: 100%;
            max-width: 98vh;
            max-height: 98vh;
            display: block;
            object-fit: contain;
        }

        /* Белый экран поверх красной области */
        .screen-overlay {
            position: absolute;
            background: white;
            pointer-events: none;
            border-radius: 2px;
            left: 0%;
            top: 0%;
            width: 0%;
            height: 0%;
            transition: none;
        }

        /* Canvas для анализа (скрыт) */
        #analysisCanvas {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="phone-frame" id="phoneFrame">
            <!-- Картинка с рамкой, где экран залит КРАСНЫМ -->
            <img id="frameImage" src="df.png" alt="Phone Frame" crossorigin="anonymous" />

            <!-- Белый экран поверх красной области -->
            <div class="screen-overlay" id="screenOverlay"></div>
        </div>
    </div>

    <!-- Скрытый canvas для анализа пикселей -->
    <canvas id="analysisCanvas"></canvas>

    <script>
        (function() {
            const img = document.getElementById('frameImage');
            const overlay = document.getElementById('screenOverlay');
            const canvas = document.getElementById('analysisCanvas');
            const ctx = canvas.getContext('2d');

            let isProcessing = false;

            function findRedArea(imageData, width, height) {
                const data = imageData.data;
                let minX = width,
                    minY = height;
                let maxX = 0,
                    maxY = 0;
                let foundRed = false;

                // Порог для определения красного цвета
                const redThreshold = 100;
                const greenBlueThreshold = 100;

                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const i = (y * width + x) * 4;
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        const a = data[i + 3];

                        // Проверяем, является ли пиксель красным
                        // Красный: r высокий, g и b низкие, и не прозрачный
                        if (a > 128 && r > redThreshold && g < greenBlueThreshold && b < greenBlueThreshold) {
                            if (x < minX) minX = x;
                            if (y < minY) minY = y;
                            if (x > maxX) maxX = x;
                            if (y > maxY) maxY = y;
                            foundRed = true;
                        }
                    }
                }

                if (!foundRed) {
                    return null;
                }

                // Добавляем небольшой отступ (1px от края красной области)
                const padding = 2;
                return {
                    left: Math.max(0, minX - padding),
                    top: Math.max(0, minY - padding),
                    width: Math.min(width, maxX - minX + padding * 2),
                    height: Math.min(height, maxY - minY + padding * 2)
                };
            }

            function processImage() {
                if (isProcessing) return;
                if (!img.complete || img.naturalWidth === 0) {
                    setTimeout(processImage, 100);
                    return;
                }

                isProcessing = true;

                // Получаем реальные размеры картинки
                const imgWidth = img.naturalWidth;
                const imgHeight = img.naturalHeight;

                // Устанавливаем размеры canvas под картинку
                canvas.width = imgWidth;
                canvas.height = imgHeight;

                // Рисуем картинку на canvas
                ctx.clearRect(0, 0, imgWidth, imgHeight);
                ctx.drawImage(img, 0, 0, imgWidth, imgHeight);

                // Получаем данные пикселей
                const imageData = ctx.getImageData(0, 0, imgWidth, imgHeight);
                const redArea = findRedArea(imageData, imgWidth, imgHeight);

                if (!redArea) {
                    console.warn('⚠️ Красная область не найдена! Убедись, что экран залит ярко-красным цветом.');
                    // Показываем ошибку на оверлее
                    overlay.style.background = 'rgba(255,0,0,0.3)';
                    overlay.style.border = '2px dashed red';
                    overlay.style.left = '10%';
                    overlay.style.top = '10%';
                    overlay.style.width = '80%';
                    overlay.style.height = '80%';
                    isProcessing = false;
                    return;
                }

                // Получаем размеры отображения картинки на экране
                const imgDisplayRect = img.getBoundingClientRect();
                const containerRect = document.getElementById('phoneFrame').getBoundingClientRect();

                // Вычисляем масштаб
                const scaleX = imgDisplayRect.width / imgWidth;
                const scaleY = imgDisplayRect.height / imgHeight;

                // Вычисляем позицию красной области в процентах от контейнера
                const leftPercent = ((redArea.left * scaleX + (imgDisplayRect.left - containerRect.left)) / containerRect.width) * 100;
                const topPercent = ((redArea.top * scaleY + (imgDisplayRect.top - containerRect.top)) / containerRect.height) * 100;
                const widthPercent = (redArea.width * scaleX / containerRect.width) * 100;
                const heightPercent = (redArea.height * scaleY / containerRect.height) * 100;

                // Применяем размеры к оверлею
                overlay.style.left = leftPercent + '%';
                overlay.style.top = topPercent + '%';
                overlay.style.width = widthPercent + '%';
                overlay.style.height = heightPercent + '%';
                overlay.style.background = 'white';
                overlay.style.border = 'none';

                console.log('✅ Красная область найдена!');
                console.log(`📐 left: ${leftPercent.toFixed(2)}%`);
                console.log(`📐 top: ${topPercent.toFixed(2)}%`);
                console.log(`📐 width: ${widthPercent.toFixed(2)}%`);
                console.log(`📐 height: ${heightPercent.toFixed(2)}%`);
                console.log(`🖼️ Размеры в пикселях: ${redArea.width}×${redArea.height}px`);

                isProcessing = false;
            }

            // Ждём загрузки картинки
            if (img.complete) {
                setTimeout(processImage, 100);
            } else {
                img.addEventListener('load', function() {
                    setTimeout(processImage, 100);
                });
            }

            // Обновляем при ресайзе
            window.addEventListener('resize', function() {
                setTimeout(processImage, 200);
            });

            // Повторная попытка через 2 секунды
            setTimeout(processImage, 2000);
        })();
    </script>
</body>
</html>
