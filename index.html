<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Phone Frame</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .phone-frame-img {
            position: absolute;
            width: auto;
            height: auto;
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }
        .screen-overlay {
            position: absolute;
            left: 39.85%;
            top: 13.03%;
            width: 20.45%;
            height: 67.77%;
            background: white;
            overflow: hidden;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="df.png" alt="Phone Frame" class="phone-frame-img" />
        <div class="screen-overlay"></div>
    </div>
</body>
</html>
