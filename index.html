<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Phone Frame</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #000;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        /* Исправленный градиент — не растягивается */
        @media (orientation: portrait) and (max-width: 768px) {
            body {
                background: radial-gradient(circle at center, #9600d6 0%, #000000 70%);
                background-attachment: fixed;
                background-size: 100% 100%;
                background-position: center;
                background-repeat: no-repeat;
                min-height: 100vh;
                min-height: 100dvh;
            }
        }

        @media (orientation: landscape) {
            body {
                background: #000;
            }
        }

        @media (min-width: 769px) {
            body {
                background: #000;
            }
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .phone-frame {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .phone-frame img {
            width: 100%;
            height: 100%;
            max-width: 98vh;
            max-height: 98vh;
            display: block;
            object-fit: contain;
            position: relative;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .phone-frame img.visible {
            opacity: 1;
        }

        #overlayCanvas {
            position: absolute;
            width: 100%;
            height: 100%;
            max-width: 98vh;
            max-height: 98vh;
            z-index: 2;
            pointer-events: none;
            display: block;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #overlayCanvas.visible {
            opacity: 1;
        }

        .rotate-message {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
            align-items: center;
            justify-content: center;
            background: #000;
            z-index: 999;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 14px;
            font-weight: 400;
            color: #666;
            letter-spacing: 0.5px;
            text-align: center;
            padding: 30px;
            flex-direction: column;
            gap: 16px;
        }

        .rotate-message.show {
            display: flex;
        }

        .rotate-message img {
            width: 60px;
            height: auto;
            display: block;
            opacity: 0.5;
        }

        @media (orientation: landscape) {
            .rotate-message {
                display: flex;
            }
            .phone-frame img,
            #overlayCanvas {
                display: none !important;
            }
        }

        @media (orientation: portrait) {
            .rotate-message {
                display: none !important;
            }
            .phone-frame img,
            #overlayCanvas {
                display: block;
            }
        }

        .desktop-message {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
            align-items: center;
            justify-content: center;
            background: #000;
            z-index: 1000;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 14px;
            font-weight: 400;
            color: #666;
            letter-spacing: 0.5px;
            text-align: center;
            padding: 30px;
            flex-direction: column;
            gap: 16px;
        }

        .desktop-message img {
            width: 60px;
            height: auto;
            display: block;
            opacity: 0.5;
        }

        @media (min-width: 769px) {
            .desktop-message {
                display: flex;
            }
            .phone-frame img,
            #overlayCanvas,
            .rotate-message {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="desktop-message" id="desktopMessage">
        ОТКРОЙ НА ТЕЛЕФОНЕ
        <img src="eyes.png" alt="" />
    </div>

    <div class="rotate-message" id="rotateMessage">
        ПЕРЕВЕРНИ ТЕЛЕФОН<br>В ПОРТРЕТНЫЙ РЕЖИМ
    </div>

    <div class="container">
        <div class="phone-frame" id="phoneFrame">
            <img id="frameImage" src="df.png" alt="Phone Frame" crossorigin="anonymous" />
            <canvas id="overlayCanvas"></canvas>
        </div>
    </div>

    <script>
        (function() {
            const img = document.getElementById('frameImage');
            const canvas = document.getElementById('overlayCanvas');
            const ctx = canvas.getContext('2d');

            const analysisCanvas = document.createElement('canvas');
            const analysisCtx = analysisCanvas.getContext('2d');

            let lastRedArea = null;
            let lastImgWidth = 0;
            let lastImgHeight = 0;
            let isReady = false;

            function isRed(r, g, b, a) {
                if (a < 30) return false;
                const rHigh = r > 180;
                const gLow = g < 80;
                const bLow = b < 80;
                const redDominates = r > g + 50 && r > b + 50;
                const isBrightEnough = (r + g + b) / 3 > 60;
                return rHigh && gLow && bLow && redDominates && isBrightEnough;
            }

            function findRedArea(imageData, width, height) {
                const data = imageData.data;
                let minX = width,
                    minY = height;
                let maxX = 0,
                    maxY = 0;
                let foundRed = false;
                let redPixels = 0;
                const step = 2;

                for (let y = 0; y < height; y += step) {
                    for (let x = 0; x < width; x += step) {
                        const i = (y * width + x) * 4;
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        const a = data[i + 3];

                        if (isRed(r, g, b, a)) {
                            redPixels++;
                            if (x < minX) minX = x;
                            if (y < minY) minY = y;
                            if (x > maxX) maxX = x;
                            if (y > maxY) maxY = y;
                            foundRed = true;
                        }
                    }
                }

                if (!foundRed || redPixels < 5) {
                    return null;
                }

                const padding = 2;
                return {
                    left: Math.max(0, minX - padding),
                    top: Math.max(0, minY - padding),
                    width: Math.min(width, maxX - minX + padding * 2),
                    height: Math.min(height, maxY - minY + padding * 2),
                    pixels: redPixels
                };
            }

            function getImageDisplayRect() {
                const imgRect = img.getBoundingClientRect();
                const containerRect = document.getElementById('phoneFrame').getBoundingClientRect();

                const imgAspect = img.naturalWidth / img.naturalHeight;
                const containerAspect = containerRect.width / containerRect.height;

                let displayWidth, displayHeight, offsetX, offsetY;

                if (imgAspect > containerAspect) {
                    displayWidth = containerRect.width;
                    displayHeight = containerRect.width / imgAspect;
                    offsetX = 0;
                    offsetY = (containerRect.height - displayHeight) / 2;
                } else {
                    displayHeight = containerRect.height;
                    displayWidth = containerRect.height * imgAspect;
                    offsetX = (containerRect.width - displayWidth) / 2;
                    offsetY = 0;
                }

                return {
                    left: offsetX,
                    top: offsetY,
                    width: displayWidth,
                    height: displayHeight,
                    containerWidth: containerRect.width,
                    containerHeight: containerRect.height
                };
            }

            function drawOverlay(redArea, imgWidth, imgHeight) {
                const display = getImageDisplayRect();
                
                canvas.width = display.containerWidth;
                canvas.height = display.containerHeight;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const scaleX = display.width / imgWidth;
                const scaleY = display.height / imgHeight;

                const x = display.left + redArea.left * scaleX;
                const y = display.top + redArea.top * scaleY;
                const w = redArea.width * scaleX;
                const h = redArea.height * scaleY;

                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(x, y, w, h);

                canvas.classList.add('visible');

                lastRedArea = redArea;
                lastImgWidth = imgWidth;
                lastImgHeight = imgHeight;
                isReady = true;
            }

            function processImage() {
                if (!img.complete || img.naturalWidth === 0) {
                    setTimeout(processImage, 200);
                    return;
                }

                const imgWidth = img.naturalWidth;
                const imgHeight = img.naturalHeight;

                analysisCanvas.width = imgWidth;
                analysisCanvas.height = imgHeight;
                analysisCtx.clearRect(0, 0, imgWidth, imgHeight);
                analysisCtx.drawImage(img, 0, 0, imgWidth, imgHeight);

                const imageData = analysisCtx.getImageData(0, 0, imgWidth, imgHeight);
                const redArea = findRedArea(imageData, imgWidth, imgHeight);

                if (!redArea) {
                    canvas.classList.remove('visible');
                    img.classList.remove('visible');
                    setTimeout(processImage, 500);
                    return;
                }

                img.classList.add('visible');
                drawOverlay(redArea, imgWidth, imgHeight);
            }

            function handleResize() {
                if (!isReady || !lastRedArea) {
                    return;
                }
                drawOverlay(lastRedArea, lastImgWidth, lastImgHeight);
            }

            if (img.complete) {
                setTimeout(processImage, 100);
            } else {
                img.addEventListener('load', function() {
                    setTimeout(processImage, 100);
                });
            }

            img.addEventListener('error', function() {
                canvas.classList.remove('visible');
                img.classList.remove('visible');
            });

            let resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(handleResize, 100);
            });

            window.addEventListener('orientationchange', function() {
                setTimeout(handleResize, 400);
            });

            setTimeout(processImage, 3000);
        })();
    </script>
</body>
</html>
