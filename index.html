<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Phone Frame</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .phone-frame {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .phone-frame img {
            width: 100%;
            height: 100%;
            max-width: 98vh;
            max-height: 98vh;
            display: block;
            object-fit: contain;
        }

        .screen-overlay {
            position: absolute;
            background: white;
            pointer-events: none;
            border-radius: 2px;
            left: 0%;
            top: 0%;
            width: 0%;
            height: 0%;
        }

        #analysisCanvas {
            display: none;
        }

        .debug-info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #0f0;
            padding: 10px 16px;
            border-radius: 6px;
            font: 12px monospace;
            z-index: 100;
            text-align: center;
            border: 1px solid #333;
            pointer-events: none;
            white-space: pre;
            max-width: 90%;
        }
        .debug-info span { color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="phone-frame" id="phoneFrame">
            <img id="frameImage" src="df.png" alt="Phone Frame" crossorigin="anonymous" />
            <div class="screen-overlay" id="screenOverlay"></div>
        </div>
    </div>

    <canvas id="analysisCanvas"></canvas>
    <div class="debug-info" id="debugInfo">⏳ Анализ изображения...</div>

    <script>
        (function() {
            const img = document.getElementById('frameImage');
            const overlay = document.getElementById('screenOverlay');
            const canvas = document.getElementById('analysisCanvas');
            const ctx = canvas.getContext('2d');
            const debug = document.getElementById('debugInfo');

            function findRedArea(imageData, width, height) {
                const data = imageData.data;
                let minX = width,
                    minY = height;
                let maxX = 0,
                    maxY = 0;
                let foundRed = false;
                let redPixels = 0;

                // Проходим по всем пикселям
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const i = (y * width + x) * 4;
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        const a = data[i + 3];

                        // Пропускаем прозрачные пиксели
                        if (a < 10) continue;

                        // Проверяем на красный цвет (r высокий, g и b низкие)
                        const isRed = (r > 150 && g < 100 && b < 100);

                        if (isRed) {
                            redPixels++;
                            if (x < minX) minX = x;
                            if (y < minY) minY = y;
                            if (x > maxX) maxX = x;
                            if (y > maxY) maxY = y;
                            foundRed = true;
                        }
                    }
                }

                debug.textContent = `🔍 Найдено красных пикселей: ${redPixels}`;

                if (!foundRed || redPixels < 50) {
                    return null;
                }

                // Добавляем небольшой отступ
                const padding = 2;
                return {
                    left: Math.max(0, minX - padding),
                    top: Math.max(0, minY - padding),
                    width: Math.min(width, maxX - minX + padding * 2),
                    height: Math.min(height, maxY - minY + padding * 2),
                    pixels: redPixels
                };
            }

            function processImage() {
                if (!img.complete || img.naturalWidth === 0) {
                    debug.textContent = '⏳ Загрузка изображения...';
                    setTimeout(processImage, 200);
                    return;
                }

                const imgWidth = img.naturalWidth;
                const imgHeight = img.naturalHeight;

                canvas.width = imgWidth;
                canvas.height = imgHeight;

                // Рисуем картинку
                ctx.clearRect(0, 0, imgWidth, imgHeight);
                ctx.drawImage(img, 0, 0, imgWidth, imgHeight);

                // Получаем данные
                const imageData = ctx.getImageData(0, 0, imgWidth, imgHeight);
                const redArea = findRedArea(imageData, imgWidth, imgHeight);

                if (!redArea) {
                    debug.textContent = '❌ Красная область не найдена!\nУбедись, что экран залит ярко-КРАСНЫМ (#FF0000)';
                    overlay.style.background = 'rgba(255,0,0,0.2)';
                    overlay.style.border = '2px dashed red';
                    overlay.style.left = '10%';
                    overlay.style.top = '10%';
                    overlay.style.width = '80%';
                    overlay.style.height = '80%';
                    return;
                }

                // Координаты красной области в пикселях
                const rect = img.getBoundingClientRect();
                const containerRect = document.getElementById('phoneFrame').getBoundingClientRect();

                const scaleX = rect.width / imgWidth;
                const scaleY = rect.height / imgHeight;

                const leftPx = redArea.left * scaleX + (rect.left - containerRect.left);
                const topPx = redArea.top * scaleY + (rect.top - containerRect.top);
                const widthPx = redArea.width * scaleX;
                const heightPx = redArea.height * scaleY;

                const leftPercent = (leftPx / containerRect.width) * 100;
                const topPercent = (topPx / containerRect.height) * 100;
                const widthPercent = (widthPx / containerRect.width) * 100;
                const heightPercent = (heightPx / containerRect.height) * 100;

                overlay.style.left = leftPercent + '%';
                overlay.style.top = topPercent + '%';
                overlay.style.width = widthPercent + '%';
                overlay.style.height = heightPercent + '%';
                overlay.style.background = 'white';
                overlay.style.border = 'none';

                debug.textContent = 
                    `✅ Найдено! ${redArea.pixels} красных пикселей\n` +
                    `📐 left: ${leftPercent.toFixed(2)}%  top: ${topPercent.toFixed(2)}%\n` +
                    `📐 width: ${widthPercent.toFixed(2)}%  height: ${heightPercent.toFixed(2)}%\n` +
                    `🖼️ ${redArea.width}×${redArea.height}px (в PNG)`;

                console.log('✅ Красная область найдена!');
                console.log(`left: ${leftPercent.toFixed(2)}%`);
                console.log(`top: ${topPercent.toFixed(2)}%`);
                console.log(`width: ${widthPercent.toFixed(2)}%`);
                console.log(`height: ${heightPercent.toFixed(2)}%`);
            }

            // Загрузка
            if (img.complete) {
                setTimeout(processImage, 100);
            } else {
                img.addEventListener('load', function() {
                    setTimeout(processImage, 100);
                });
            }

            img.addEventListener('error', function() {
                debug.textContent = '❌ Ошибка загрузки df.png!\nПроверь путь к файлу.';
            });

            window.addEventListener('resize', function() {
                setTimeout(processImage, 300);
            });

            setTimeout(processImage, 3000);
        })();
    </script>
</body>
</html>
