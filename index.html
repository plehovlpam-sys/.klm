<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Phone Frame Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: white;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: monospace;
        }
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .phone-frame-img {
            position: absolute;
            width: auto;
            height: auto;
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }
        .screen-overlay {
            position: absolute;
            border: 2px dashed rgba(255, 0, 0, 0.5);
            background: rgba(255, 0, 0, 0.05);
            cursor: move;
            overflow: auto;
            min-width: 30px;
            min-height: 30px;
        }
        .screen-overlay::after {
            content: '';
            position: absolute;
            bottom: -8px;
            right: -8px;
            width: 16px;
            height: 16px;
            background: rgba(255, 0, 0, 0.3);
            border: 2px solid red;
            border-radius: 2px;
            cursor: nw-resize;
        }
        .info-panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #0f0;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-family: monospace;
            z-index: 100;
            text-align: center;
            line-height: 1.6;
            border: 1px solid #333;
            pointer-events: none;
            user-select: all;
            white-space: pre;
        }
        .info-panel span {
            color: #fff;
        }
        .info-panel .values {
            color: #0f0;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <img src="df.png" alt="Phone Frame" class="phone-frame-img" id="phoneFrame" />
        <div class="screen-overlay" id="screenOverlay"></div>
    </div>

    <div class="info-panel" id="infoPanel">
        <span>📐 ПОЛОЖЕНИЕ ЭКРАНА (в % от размера контейнера)</span>
        <span class="values" id="coords">left: 0% | top: 0% | width: 0% | height: 0%</span>
        <span>⬅️ Перетащи мышкой | ↕️ Растягивай за угол</span>
        <span style="color:#888;font-size:11px;">⏺ Значения автоматически пересчитываются в %</span>
    </div>

    <script>
        (function() {
            const overlay = document.getElementById('screenOverlay');
            const container = document.getElementById('container');
            const coordsDisplay = document.getElementById('coords');

            // === НАЧАЛЬНЫЕ ЗНАЧЕНИЯ В % (от размера контейнера) ===
            // МЕНЯЙ ЭТИ ЦИФРЫ, ЧТОБЫ ПОДОГНАТЬ ЭКРАН ПОД РАМКУ
            let leftPercent = 12.5;   // отступ слева в %
            let topPercent = 21.5;    // отступ сверху в %
            let widthPercent = 75;     // ширина в %
            let heightPercent = 57;    // высота в %

            let isDragging = false;
            let isResizing = false;
            let startX, startY, startLeftP, startTopP, startWidthP, startHeightP;

            function updateSize() {
                const containerWidth = container.clientWidth;
                const containerHeight = container.clientHeight;

                const leftPx = (leftPercent / 100) * containerWidth;
                const topPx = (topPercent / 100) * containerHeight;
                const widthPx = (widthPercent / 100) * containerWidth;
                const heightPx = (heightPercent / 100) * containerHeight;

                overlay.style.left = leftPx + 'px';
                overlay.style.top = topPx + 'px';
                overlay.style.width = widthPx + 'px';
                overlay.style.height = heightPx + 'px';

                coordsDisplay.textContent = 
                    `left: ${leftPercent.toFixed(2)}% | top: ${topPercent.toFixed(2)}% | width: ${widthPercent.toFixed(2)}% | height: ${heightPercent.toFixed(2)}%`;
            }

            function getPercentFromPixels() {
                const containerWidth = container.clientWidth;
                const containerHeight = container.clientHeight;
                const rect = overlay.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();

                leftPercent = ((rect.left - containerRect.left) / containerWidth) * 100;
                topPercent = ((rect.top - containerRect.top) / containerHeight) * 100;
                widthPercent = (rect.width / containerWidth) * 100;
                heightPercent = (rect.height / containerHeight) * 100;

                // Ограничиваем, чтобы не улетело за границы
                leftPercent = Math.max(0, Math.min(100 - widthPercent, leftPercent));
                topPercent = Math.max(0, Math.min(100 - heightPercent, topPercent));
                widthPercent = Math.max(2, Math.min(98, widthPercent));
                heightPercent = Math.max(2, Math.min(98, heightPercent));

                updateSize();
            }

            // Перетаскивание
            overlay.addEventListener('mousedown', function(e) {
                if (e.target === overlay || e.target === overlay.firstChild) {
                    isDragging = true;
                    const containerRect = container.getBoundingClientRect();
                    startX = e.clientX;
                    startY = e.clientY;
                    startLeftP = leftPercent;
                    startTopP = topPercent;
                    overlay.style.cursor = 'grabbing';
                    e.preventDefault();
                }
            });

            document.addEventListener('mousemove', function(e) {
                if (isDragging) {
                    const containerWidth = container.clientWidth;
                    const containerHeight = container.clientHeight;
                    const dxP = ((e.clientX - startX) / containerWidth) * 100;
                    const dyP = ((e.clientY - startY) / containerHeight) * 100;

                    let newLeft = startLeftP + dxP;
                    let newTop = startTopP + dyP;

                    // Ограничения
                    newLeft = Math.max(0, Math.min(100 - widthPercent, newLeft));
                    newTop = Math.max(0, Math.min(100 - heightPercent, newTop));

                    leftPercent = newLeft;
                    topPercent = newTop;
                    updateSize();
                }

                if (isResizing) {
                    const containerWidth = container.clientWidth;
                    const containerHeight = container.clientHeight;
                    const dxP = ((e.clientX - startX) / containerWidth) * 100;
                    const dyP = ((e.clientY - startY) / containerHeight) * 100;

                    let newWidth = startWidthP + dxP;
                    let newHeight = startHeightP + dyP;

                    newWidth = Math.max(2, Math.min(98 - leftPercent, newWidth));
                    newHeight = Math.max(2, Math.min(98 - topPercent, newHeight));

                    widthPercent = newWidth;
                    heightPercent = newHeight;
                    updateSize();
                }
            });

            document.addEventListener('mouseup', function() {
                if (isDragging) {
                    isDragging = false;
                    overlay.style.cursor = 'move';
                }
                if (isResizing) {
                    isResizing = false;
                }
            });

            // Ресайз за угол
            const resizeHandle = document.createElement('div');
            resizeHandle.style.cssText = `
                position: absolute;
                bottom: -6px;
                right: -6px;
                width: 18px;
                height: 18px;
                background: rgba(255, 0, 0, 0.4);
                border: 2px solid red;
                border-radius: 2px;
                cursor: nw-resize;
                z-index: 10;
            `;
            overlay.appendChild(resizeHandle);

            resizeHandle.addEventListener('mousedown', function(e) {
                isResizing = true;
                startX = e.clientX;
                startY = e.clientY;
                startWidthP = widthPercent;
                startHeightP = heightPercent;
                e.stopPropagation();
                e.preventDefault();
            });

            // Обновление при ресайзе окна
            window.addEventListener('resize', function() {
                updateSize();
            });

            // Первоначальная отрисовка
            setTimeout(updateSize, 50);

            // Дополнительное обновление после загрузки картинки
            document.getElementById('phoneFrame').addEventListener('load', function() {
                setTimeout(updateSize, 100);
            });

            // Показываем значения для копирования
            console.log('📱 Используй эти значения в CSS:');
            console.log(`left: ${leftPercent.toFixed(2)}%`);
            console.log(`top: ${topPercent.toFixed(2)}%`);
            console.log(`width: ${widthPercent.toFixed(2)}%`);
            console.log(`height: ${heightPercent.toFixed(2)}%`);

            // Горячая клавиша для копирования значений (Shift+C)
            document.addEventListener('keydown', function(e) {
                if (e.shiftKey && e.key === 'C') {
                    const text = `left: ${leftPercent.toFixed(2)}% | top: ${topPercent.toFixed(2)}% | width: ${widthPercent.toFixed(2)}% | height: ${heightPercent.toFixed(2)}%`;
                    navigator.clipboard.writeText(text).then(() => {
                        alert('✅ Значения скопированы:\n' + text);
                    });
                }
            });
        })();
    </script>
</body>
</html>
