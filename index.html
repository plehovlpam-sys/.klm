<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Phone Frame</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .phone-frame {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Картинка с рамкой */
        .phone-frame img {
            width: 100%;
            height: 100%;
            max-width: 98vh;
            max-height: 98vh;
            display: block;
            object-fit: contain;
            position: relative;
            z-index: 1;
        }

        /* Канвас поверх картинки для рисования белого экрана */
        #overlayCanvas {
            position: absolute;
            width: 100%;
            height: 100%;
            max-width: 98vh;
            max-height: 98vh;
            z-index: 2;
            pointer-events: none;
            display: block;
            object-fit: contain;
        }

        .debug-info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #0f0;
            padding: 10px 16px;
            border-radius: 6px;
            font: 12px monospace;
            z-index: 100;
            text-align: center;
            border: 1px solid #333;
            pointer-events: none;
            white-space: pre;
            max-width: 92%;
            line-height: 1.5;
        }
        .debug-info .err { color: #ff6666; }
        .debug-info .ok { color: #66ff66; }
    </style>
</head>
<body>
    <div class="container">
        <div class="phone-frame" id="phoneFrame">
            <img id="frameImage" src="df.png" alt="Phone Frame" crossorigin="anonymous" />
            <canvas id="overlayCanvas"></canvas>
        </div>
    </div>

    <div class="debug-info" id="debugInfo">⏳ Анализ изображения...</div>

    <script>
        (function() {
            const img = document.getElementById('frameImage');
            const canvas = document.getElementById('overlayCanvas');
            const ctx = canvas.getContext('2d');
            const debug = document.getElementById('debugInfo');

            // Скрытый канвас для анализа
            const analysisCanvas = document.createElement('canvas');
            const analysisCtx = analysisCanvas.getContext('2d');

            function findRedArea(imageData, width, height) {
                const data = imageData.data;
                let minX = width,
                    minY = height;
                let maxX = 0,
                    maxY = 0;
                let foundRed = false;
                let redPixels = 0;

                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const i = (y * width + x) * 4;
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        const a = data[i + 3];

                        if (a < 10) continue;

                        // Ярко-красный
                        const isRed = (r > 200 && g < 60 && b < 60);

                        if (isRed) {
                            redPixels++;
                            if (x < minX) minX = x;
                            if (y < minY) minY = y;
                            if (x > maxX) maxX = x;
                            if (y > maxY) maxY = y;
                            foundRed = true;
                        }
                    }
                }

                if (!foundRed || redPixels < 10) {
                    return null;
                }

                const padding = 1;
                return {
                    left: Math.max(0, minX - padding),
                    top: Math.max(0, minY - padding),
                    width: Math.min(width, maxX - minX + padding * 2),
                    height: Math.min(height, maxY - minY + padding * 2),
                    pixels: redPixels
                };
            }

            function drawOverlay(redArea, imgWidth, imgHeight, displayWidth, displayHeight) {
                // Очищаем канвас
                canvas.width = displayWidth;
                canvas.height = displayHeight;
                ctx.clearRect(0, 0, displayWidth, displayHeight);

                // Масштаб отображения
                const scaleX = displayWidth / imgWidth;
                const scaleY = displayHeight / imgHeight;

                // Координаты красной области в пикселях отображения
                const x = redArea.left * scaleX;
                const y = redArea.top * scaleY;
                const w = redArea.width * scaleX;
                const h = redArea.height * scaleY;

                // Рисуем белый прямоугольник
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(x, y, w, h);

                // Рисуем красную рамку для проверки (видно где область)
                ctx.strokeStyle = '#FF0000';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, w, h);

                debug.innerHTML = 
                    `<span class="ok">✅ Красная область найдена!</span>\n` +
                    `📐 left: ${(x / displayWidth * 100).toFixed(2)}%  top: ${(y / displayHeight * 100).toFixed(2)}%\n` +
                    `📐 width: ${(w / displayWidth * 100).toFixed(2)}%  height: ${(h / displayHeight * 100).toFixed(2)}%\n` +
                    `🖼️ ${redArea.width}×${redArea.height}px (в PNG) | ${redArea.pixels} красных пикселей`;

                console.log('✅ Красная область найдена!');
                console.log(`left: ${(x / displayWidth * 100).toFixed(2)}%`);
                console.log(`top: ${(y / displayHeight * 100).toFixed(2)}%`);
                console.log(`width: ${(w / displayWidth * 100).toFixed(2)}%`);
                console.log(`height: ${(h / displayHeight * 100).toFixed(2)}%`);
            }

            function processImage() {
                if (!img.complete || img.naturalWidth === 0) {
                    debug.innerHTML = '⏳ Загрузка изображения...';
                    setTimeout(processImage, 200);
                    return;
                }

                const imgWidth = img.naturalWidth;
                const imgHeight = img.naturalHeight;

                // Анализируем картинку
                analysisCanvas.width = imgWidth;
                analysisCanvas.height = imgHeight;
                analysisCtx.clearRect(0, 0, imgWidth, imgHeight);
                analysisCtx.drawImage(img, 0, 0, imgWidth, imgHeight);

                const imageData = analysisCtx.getImageData(0, 0, imgWidth, imgHeight);
                const redArea = findRedArea(imageData, imgWidth, imgHeight);

                if (!redArea) {
                    debug.innerHTML = 
                        `<span class="err">❌ Красная область не найдена!</span>\n` +
                        `Убедись, что экран залит ярко-КРАСНЫМ (#FF0000)\n` +
                        `и в PNG нет других красных элементов.`;
                    
                    // Рисуем заглушку для проверки
                    const rect = img.getBoundingClientRect();
                    canvas.width = rect.width;
                    canvas.height = rect.height;
                    ctx.fillStyle = 'rgba(255,0,0,0.2)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.strokeStyle = '#FF0000';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);
                    ctx.setLineDash([]);
                    return;
                }

                // Рисуем на канвасе поверх картинки
                const rect = img.getBoundingClientRect();
                const displayWidth = rect.width;
                const displayHeight = rect.height;

                // Устанавливаем размер канваса как у картинки
                canvas.width = displayWidth;
                canvas.height = displayHeight;

                // Рисуем белый экран
                const scaleX = displayWidth / imgWidth;
                const scaleY = displayHeight / imgHeight;

                const x = redArea.left * scaleX;
                const y = redArea.top * scaleY;
                const w = redArea.width * scaleX;
                const h = redArea.height * scaleY;

                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(x, y, w, h);

                // Красная рамка для визуальной проверки
                ctx.strokeStyle = '#FF0000';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, w, h);

                debug.innerHTML = 
                    `<span class="ok">✅ Красная область найдена!</span>\n` +
                    `📐 left: ${(x / displayWidth * 100).toFixed(2)}%  top: ${(y / displayHeight * 100).toFixed(2)}%\n` +
                    `📐 width: ${(w / displayWidth * 100).toFixed(2)}%  height: ${(h / displayHeight * 100).toFixed(2)}%\n` +
                    `🖼️ ${redArea.width}×${redArea.height}px (в PNG) | ${redArea.pixels} красных пикселей`;

                console.log('✅ Красная область найдена!');
                console.log(`left: ${(x / displayWidth * 100).toFixed(2)}%`);
                console.log(`top: ${(y / displayHeight * 100).toFixed(2)}%`);
                console.log(`width: ${(w / displayWidth * 100).toFixed(2)}%`);
                console.log(`height: ${(h / displayHeight * 100).toFixed(2)}%`);
            }

            // === ЗАПУСК ===
            if (img.complete) {
                setTimeout(processImage, 100);
            } else {
                img.addEventListener('load', function() {
                    setTimeout(processImage, 100);
                });
            }

            img.addEventListener('error', function() {
                debug.innerHTML = '<span class="err">❌ Ошибка загрузки df.png!\nПроверь путь к файлу.</span>';
            });

            window.addEventListener('resize', function() {
                setTimeout(processImage, 300);
            });

            setTimeout(processImage, 3000);
        })();
    </script>
</body>
</html>
