<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Phone Frame</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600&display=swap" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #000;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        }

        @media (orientation: portrait) and (max-width: 768px) {
            body {
                background: radial-gradient(circle at center, #7b00b3 0%, #4a0066 35%, #2b003d 65%, #000000 90%);
                background-attachment: fixed;
                background-size: 100% 100%;
                background-position: center;
                background-repeat: no-repeat;
                min-height: 100vh;
                min-height: 100dvh;
            }
        }

        @media (orientation: landscape) {
            body {
                background: #000;
            }
        }

        @media (min-width: 769px) {
            body {
                background: #000;
            }
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .phone-frame {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .phone-frame img {
            width: 100%;
            height: 100%;
            max-width: 98vh;
            max-height: 98vh;
            display: block;
            object-fit: contain;
            position: relative;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .phone-frame img.visible {
            opacity: 1;
        }

        #overlayCanvas {
            position: absolute;
            width: 100%;
            height: 100%;
            max-width: 98vh;
            max-height: 98vh;
            z-index: 2;
            pointer-events: none;
            display: block;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #overlayCanvas.visible {
            opacity: 1;
        }

        .wp-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            background: #000;
            padding: 12px 20px 30px;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .wp-content.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .wp-content::-webkit-scrollbar {
            display: none;
        }

        /* ===== СТАТУС БАР (FIXED, НЕ СКРОЛЛИТСЯ) ===== */
        .wp-content .statusbar {
            position: sticky;
            top: 0;
            z-index: 10;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 0 10px 0;
            flex-shrink: 0;
            font-family: 'Segoe UI', sans-serif;
            font-size: 12px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.2px;
            background: #000;
        }

        .wp-content .statusbar .left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .wp-content .statusbar .right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .wp-content .statusbar .signal {
            display: flex;
            align-items: flex-end;
            gap: 1.5px;
            height: 12px;
        }

        .wp-content .statusbar .signal span {
            display: block;
            width: 3px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 1px;
        }

        .wp-content .statusbar .signal span:nth-child(1) { height: 4px; }
        .wp-content .statusbar .signal span:nth-child(2) { height: 6px; }
        .wp-content .statusbar .signal span:nth-child(3) { height: 8px; }
        .wp-content .statusbar .signal span:nth-child(4) { height: 10px; }
        .wp-content .statusbar .signal span:nth-child(5) { height: 12px; }

        .wp-content .statusbar .wifi {
            display: inline-block;
            width: 16px;
            height: 12px;
        }

        .wp-content .statusbar .wifi svg {
            width: 16px;
            height: 12px;
            fill: rgba(255, 255, 255, 0.6);
        }

        .wp-content .statusbar .battery {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
        }

        .wp-content .statusbar .battery svg {
            width: 20px;
            height: 10px;
            fill: none;
            stroke: rgba(255, 255, 255, 0.6);
            stroke-width: 1.2;
        }

        .wp-content .statusbar .battery .fill {
            fill: rgba(255, 255, 255, 0.6);
            stroke: none;
        }

        .wp-content .statusbar .time {
            font-size: 13px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.8);
        }

        /* ===== КОНТЕНТ ===== */
        .wp-content .title {
            font-family: 'Segoe UI', sans-serif;
            font-size: 44px;
            font-weight: 300;
            color: #fff;
            letter-spacing: -1px;
            text-transform: lowercase;
            margin-top: 4px;
            margin-bottom: 8px;
            line-height: 1;
            text-align: left;
            width: 100%;
            flex-shrink: 0;
        }

        .wp-content .image-wrap {
            width: 100%;
            padding: 4px 0 12px 0;
            line-height: 0;
            flex-shrink: 0;
            background: transparent;
            min-height: 50px;
            text-align: left;
        }

        .wp-content .image-wrap img {
            width: auto;
            max-width: 100%;
            height: auto;
            max-height: 300px;
            object-fit: contain;
            display: block;
            border-radius: 0;
            box-shadow: none;
            background: transparent;
            opacity: 1;
            visibility: visible;
            margin: 0;
        }

        .wp-content .buttons {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
            width: 100%;
            max-width: 200px;
            margin-top: 4px;
            flex-shrink: 0;
        }

        .wp-content .buttons a {
            display: block;
            width: 100%;
            font-family: 'Segoe UI', sans-serif;
            font-size: 15px;
            font-weight: 400;
            text-transform: lowercase;
            color: #fff;
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.5);
            padding: 10px 16px;
            text-align: left;
            text-decoration: none;
            letter-spacing: 0.3px;
            transition: background 0.15s ease, border-color 0.15s ease;
            border-radius: 0;
            box-shadow: none;
            pointer-events: auto;
            cursor: pointer;
        }

        .wp-content .buttons a:active {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.8);
        }

        .wp-content .spacer {
            flex: 1;
            min-height: 10px;
        }

        .wp-content .bottom-text {
            font-family: 'Segoe UI', sans-serif;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.12);
            text-align: left;
            text-transform: lowercase;
            letter-spacing: 0.5px;
            margin-top: 16px;
            padding-bottom: 6px;
            line-height: 1.4;
            flex-shrink: 0;
            width: 100%;
        }

        .rotate-message {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
            align-items: center;
            justify-content: center;
            background: #000;
            z-index: 999;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            font-size: 14px;
            font-weight: 400;
            color: #666;
            letter-spacing: 0.5px;
            text-align: center;
            padding: 30px;
            flex-direction: column;
            gap: 16px;
        }

        .rotate-message.show {
            display: flex;
        }

        .rotate-message img {
            width: 60px;
            height: auto;
            display: block;
            opacity: 0.5;
        }

        @media (orientation: landscape) {
            .rotate-message {
                display: flex;
            }
            .phone-frame img,
            #overlayCanvas,
            .wp-content {
                display: none !important;
            }
        }

        @media (orientation: portrait) {
            .rotate-message {
                display: none !important;
            }
            .phone-frame img,
            #overlayCanvas,
            .wp-content {
                display: flex;
            }
        }

        .desktop-message {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
            align-items: center;
            justify-content: center;
            background: #000;
            z-index: 1000;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            font-size: 14px;
            font-weight: 400;
            color: #666;
            letter-spacing: 0.5px;
            text-align: center;
            padding: 30px;
            flex-direction: column;
            gap: 16px;
        }

        .desktop-message img {
            width: 60px;
            height: auto;
            display: block;
            opacity: 0.5;
        }

        @media (min-width: 769px) {
            .desktop-message {
                display: flex;
            }
            .phone-frame img,
            #overlayCanvas,
            .wp-content,
            .rotate-message {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="desktop-message" id="desktopMessage">
        ОТКРОЙ НА ТЕЛЕФОНЕ
        <img src="eyes.png" alt="" />
    </div>

    <div class="rotate-message" id="rotateMessage">
        ПЕРЕВЕРНИ ТЕЛЕФОН<br>В ПОРТРЕТНЫЙ РЕЖИМ
    </div>

    <div class="container">
        <div class="phone-frame" id="phoneFrame">
            <img id="frameImage" src="df.png" alt="Phone Frame" crossorigin="anonymous" />
            <canvas id="overlayCanvas"></canvas>

            <div class="wp-content" id="wpContent">
                <!-- СТАТУС БАР (НЕ СКРОЛЛИТСЯ) -->
                <div class="statusbar">
                    <div class="left">
                        <span class="signal">
                            <span></span><span></span><span></span><span></span><span></span>
                        </span>
                        <span class="wifi">
                            <svg viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M8 11.5C8.82843 11.5 9.5 10.8284 9.5 10C9.5 9.17157 8.82843 8.5 8 8.5C7.17157 8.5 6.5 9.17157 6.5 10C6.5 10.8284 7.17157 11.5 8 11.5Z" fill="rgba(255,255,255,0.6)"/>
                                <path d="M5.5 8C6.5 7.2 7.7 6.7 9 6.7C10.3 6.7 11.5 7.2 12.5 8L11 9.5C10.3 8.9 9.3 8.6 8.5 8.6C7.7 8.6 6.7 8.9 6 9.5L5.5 8Z" fill="rgba(255,255,255,0.6)"/>
                                <path d="M3 5.5C4.5 4.2 6.3 3.5 8.5 3.5C10.7 3.5 12.5 4.2 14 5.5L12.5 7C11.3 6 9.9 5.5 8.5 5.5C7.1 5.5 5.7 6 4.5 7L3 5.5Z" fill="rgba(255,255,255,0.6)"/>
                                <path d="M0.5 3C2.5 1.3 5.2 0.5 8.5 0.5C11.8 0.5 14.5 1.3 16.5 3L15 4.5C13.3 3.2 11 2.5 8.5 2.5C6 2.5 3.7 3.2 2 4.5L0.5 3Z" fill="rgba(255,255,255,0.6)"/>
                            </svg>
                        </span>
                        <span class="battery">
                            <span>100%</span>
                            <svg viewBox="0 0 24 12">
                                <rect x="0.5" y="0.5" width="19" height="11" rx="1.5" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
                                <rect x="20.5" y="3.5" width="2.5" height="5" rx="0.5" fill="rgba(255,255,255,0.6)"/>
                                <rect x="2" y="2" width="16" height="8" rx="1" class="fill" fill="rgba(255,255,255,0.6)"/>
                            </svg>
                        </span>
                    </div>
                    <div class="right">
                        <span class="time" id="clockTime">00:00</span>
                    </div>
                </div>

                <div class="title">heyyy</div>
                <div class="image-wrap">
                    <img src="a.jpg" alt="" id="innerImage" />
                </div>
                <div class="buttons">
                    <a href="#" target="_blank">ig</a>
                    <a href="#" target="_blank">tg (dm)</a>
                    <a href="#" target="_blank">tg (channel)</a>
                </div>
                <div class="spacer"></div>
                <div class="bottom-text">windows phone 8</div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const img = document.getElementById('frameImage');
            const canvas = document.getElementById('overlayCanvas');
            const ctx = canvas.getContext('2d');
            const wpContent = document.getElementById('wpContent');
            const innerImage = document.getElementById('innerImage');
            const clockTime = document.getElementById('clockTime');

            function updateClock() {
                const now = new Date();
                const h = String(now.getHours()).padStart(2, '0');
                const m = String(now.getMinutes()).padStart(2, '0');
                clockTime.textContent = h + ':' + m;
            }
            updateClock();
            setInterval(updateClock, 10000);

            const analysisCanvas = document.createElement('canvas');
            const analysisCtx = analysisCanvas.getContext('2d');

            let lastRedArea = null;
            let lastImgWidth = 0;
            let lastImgHeight = 0;
            let isReady = false;
            let isWpVisible = false;

            innerImage.addEventListener('load', function() {
                this.style.opacity = '1';
                this.style.visibility = 'visible';
            });

            innerImage.addEventListener('error', function() {
                this.style.background = '#222';
                this.style.minHeight = '80px';
                this.alt = 'a.jpg не найдена';
            });

            function isRed(r, g, b, a) {
                if (a < 30) return false;
                const rHigh = r > 180;
                const gLow = g < 80;
                const bLow = b < 80;
                const redDominates = r > g + 50 && r > b + 50;
                const isBrightEnough = (r + g + b) / 3 > 60;
                return rHigh && gLow && bLow && redDominates && isBrightEnough;
            }

            function findRedArea(imageData, width, height) {
                const data = imageData.data;
                let minX = width,
                    minY = height;
                let maxX = 0,
                    maxY = 0;
                let foundRed = false;
                let redPixels = 0;
                const step = 2;

                for (let y = 0; y < height; y += step) {
                    for (let x = 0; x < width; x += step) {
                        const i = (y * width + x) * 4;
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        const a = data[i + 3];

                        if (isRed(r, g, b, a)) {
                            redPixels++;
                            if (x < minX) minX = x;
                            if (y < minY) minY = y;
                            if (x > maxX) maxX = x;
                            if (y > maxY) maxY = y;
                            foundRed = true;
                        }
                    }
                }

                if (!foundRed || redPixels < 5) {
                    return null;
                }

                const padding = 2;
                return {
                    left: Math.max(0, minX - padding),
                    top: Math.max(0, minY - padding),
                    width: Math.min(width, maxX - minX + padding * 2),
                    height: Math.min(height, maxY - minY + padding * 2),
                    pixels: redPixels
                };
            }

            function getImageDisplayRect() {
                const imgRect = img.getBoundingClientRect();
                const containerRect = document.getElementById('phoneFrame').getBoundingClientRect();

                const imgAspect = img.naturalWidth / img.naturalHeight;
                const containerAspect = containerRect.width / containerRect.height;

                let displayWidth, displayHeight, offsetX, offsetY;

                if (imgAspect > containerAspect) {
                    displayWidth = containerRect.width;
                    displayHeight = containerRect.width / imgAspect;
                    offsetX = 0;
                    offsetY = (containerRect.height - displayHeight) / 2;
                } else {
                    displayHeight = containerRect.height;
                    displayWidth = containerRect.height * imgAspect;
                    offsetX = (containerRect.width - displayWidth) / 2;
                    offsetY = 0;
                }

                return {
                    left: offsetX,
                    top: offsetY,
                    width: displayWidth,
                    height: displayHeight,
                    containerWidth: containerRect.width,
                    containerHeight: containerRect.height
                };
            }

            function drawOverlay(redArea, imgWidth, imgHeight) {
                const display = getImageDisplayRect();

                canvas.width = display.containerWidth;
                canvas.height = display.containerHeight;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const scaleX = display.width / imgWidth;
                const scaleY = display.height / imgHeight;

                const x = display.left + redArea.left * scaleX;
                const y = display.top + redArea.top * scaleY;
                const w = redArea.width * scaleX;
                const h = redArea.height * scaleY;

                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(x, y, w, h);

                canvas.classList.add('visible');

                wpContent.style.left = x + 'px';
                wpContent.style.top = y + 'px';
                wpContent.style.width = w + 'px';
                wpContent.style.height = h + 'px';

                lastRedArea = redArea;
                lastImgWidth = imgWidth;
                lastImgHeight = imgHeight;
                isReady = true;

                if (!isWpVisible) {
                    isWpVisible = true;
                    setTimeout(function() {
                        wpContent.classList.add('visible');
                    }, 150);
                }
            }

            function processImage() {
                if (!img.complete || img.naturalWidth === 0) {
                    setTimeout(processImage, 200);
                    return;
                }

                const imgWidth = img.naturalWidth;
                const imgHeight = img.naturalHeight;

                analysisCanvas.width = imgWidth;
                analysisCanvas.height = imgHeight;
                analysisCtx.clearRect(0, 0, imgWidth, imgHeight);
                analysisCtx.drawImage(img, 0, 0, imgWidth, imgHeight);

                const imageData = analysisCtx.getImageData(0, 0, imgWidth, imgHeight);
                const redArea = findRedArea(imageData, imgWidth, imgHeight);

                if (!redArea) {
                    canvas.classList.remove('visible');
                    wpContent.classList.remove('visible');
                    isWpVisible = false;
                    img.classList.remove('visible');
                    setTimeout(processImage, 500);
                    return;
                }

                img.classList.add('visible');
                drawOverlay(redArea, imgWidth, imgHeight);
            }

            function handleResize() {
                if (!isReady || !lastRedArea) {
                    return;
                }
                drawOverlay(lastRedArea, lastImgWidth, lastImgHeight);
            }

            if (img.complete) {
                setTimeout(processImage, 100);
            } else {
                img.addEventListener('load', function() {
                    setTimeout(processImage, 100);
                });
            }

            img.addEventListener('error', function() {
                canvas.classList.remove('visible');
                wpContent.classList.remove('visible');
                isWpVisible = false;
                img.classList.remove('visible');
            });

            let resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(handleResize, 100);
            });

            window.addEventListener('orientationchange', function() {
                setTimeout(handleResize, 400);
            });

            setTimeout(processImage, 3000);
        })();
    </script>
</body>
</html>
