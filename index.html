<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Phone Frame</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .phone-frame {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .phone-frame img {
            width: 100%;
            height: 100%;
            max-width: 98vh;
            max-height: 98vh;
            display: block;
            object-fit: contain;
            position: relative;
            z-index: 1;
        }

        #overlayCanvas {
            position: absolute;
            width: 100%;
            height: 100%;
            max-width: 98vh;
            max-height: 98vh;
            z-index: 2;
            pointer-events: none;
            display: block;
            object-fit: contain;
        }

        .debug-info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #0f0;
            padding: 10px 16px;
            border-radius: 6px;
            font: 12px monospace;
            z-index: 100;
            text-align: center;
            border: 1px solid #333;
            pointer-events: none;
            white-space: pre;
            max-width: 92%;
            line-height: 1.5;
        }
        .debug-info .err { color: #ff6666; }
        .debug-info .ok { color: #66ff66; }
    </style>
</head>
<body>
    <div class="container">
        <div class="phone-frame" id="phoneFrame">
            <img id="frameImage" src="df.png" alt="Phone Frame" crossorigin="anonymous" />
            <canvas id="overlayCanvas"></canvas>
        </div>
    </div>

    <div class="debug-info" id="debugInfo">⏳ Анализ изображения...</div>

    <script>
        (function() {
            const img = document.getElementById('frameImage');
            const canvas = document.getElementById('overlayCanvas');
            const ctx = canvas.getContext('2d');
            const debug = document.getElementById('debugInfo');

            const analysisCanvas = document.createElement('canvas');
            const analysisCtx = analysisCanvas.getContext('2d');

            let lastRedArea = null;
            let lastImgWidth = 0;
            let lastImgHeight = 0;

            // === ОПРЕДЕЛЕНИЕ КРАСНОГО ===
            function isRed(r, g, b, a) {
                if (a < 30) return false;
                const rHigh = r > 180;
                const gLow = g < 80;
                const bLow = b < 80;
                const redDominates = r > g + 50 && r > b + 50;
                const isBrightEnough = (r + g + b) / 3 > 60;
                return rHigh && gLow && bLow && redDominates && isBrightEnough;
            }

            function findRedArea(imageData, width, height) {
                const data = imageData.data;
                let minX = width,
                    minY = height;
                let maxX = 0,
                    maxY = 0;
                let foundRed = false;
                let redPixels = 0;
                const step = 2;

                for (let y = 0; y < height; y += step) {
                    for (let x = 0; x < width; x += step) {
                        const i = (y * width + x) * 4;
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        const a = data[i + 3];

                        if (isRed(r, g, b, a)) {
                            redPixels++;
                            if (x < minX) minX = x;
                            if (y < minY) minY = y;
                            if (x > maxX) maxX = x;
                            if (y > maxY) maxY = y;
                            foundRed = true;
                        }
                    }
                }

                if (!foundRed || redPixels < 5) {
                    return null;
                }

                const padding = 2;
                return {
                    left: Math.max(0, minX - padding),
                    top: Math.max(0, minY - padding),
                    width: Math.min(width, maxX - minX + padding * 2),
                    height: Math.min(height, maxY - minY + padding * 2),
                    pixels: redPixels
                };
            }

            function getImageDisplayRect() {
                const imgRect = img.getBoundingClientRect();
                const containerRect = document.getElementById('phoneFrame').getBoundingClientRect();

                // Вычисляем видимую область картинки с учетом object-fit: contain
                const imgAspect = img.naturalWidth / img.naturalHeight;
                const containerAspect = containerRect.width / containerRect.height;

                let displayWidth, displayHeight, offsetX, offsetY;

                if (imgAspect > containerAspect) {
                    // Картинка шире контейнера — подгоняем по ширине
                    displayWidth = containerRect.width;
                    displayHeight = containerRect.width / imgAspect;
                    offsetX = 0;
                    offsetY = (containerRect.height - displayHeight) / 2;
                } else {
                    // Картинка выше контейнера — подгоняем по высоте
                    displayHeight = containerRect.height;
                    displayWidth = containerRect.height * imgAspect;
                    offsetX = (containerRect.width - displayWidth) / 2;
                    offsetY = 0;
                }

                return {
                    left: offsetX,
                    top: offsetY,
                    width: displayWidth,
                    height: displayHeight,
                    containerWidth: containerRect.width,
                    containerHeight: containerRect.height
                };
            }

            function drawOverlay(redArea, imgWidth, imgHeight) {
                const display = getImageDisplayRect();
                
                // Устанавливаем размер канваса равным контейнеру
                canvas.width = display.containerWidth;
                canvas.height = display.containerHeight;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Масштаб отображения (относительно видимой области)
                const scaleX = display.width / imgWidth;
                const scaleY = display.height / imgHeight;

                // Координаты красной области в пикселях отображения
                const x = display.left + redArea.left * scaleX;
                const y = display.top + redArea.top * scaleY;
                const w = redArea.width * scaleX;
                const h = redArea.height * scaleY;

                // Белый экран
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(x, y, w, h);

                // Красная рамка для проверки
                ctx.strokeStyle = 'rgba(255,0,0,0.7)';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, w, h);

                // Информация на канвасе
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(10, 10, 220, 50);
                ctx.fillStyle = '#00ff00';
                ctx.font = '12px monospace';
                const leftPercent = (x / canvas.width * 100);
                const topPercent = (y / canvas.height * 100);
                const widthPercent = (w / canvas.width * 100);
                const heightPercent = (h / canvas.height * 100);
                ctx.fillText(`📐 left: ${leftPercent.toFixed(2)}%  top: ${topPercent.toFixed(2)}%`, 18, 30);
                ctx.fillText(`📐 width: ${widthPercent.toFixed(2)}%  height: ${heightPercent.toFixed(2)}%`, 18, 48);

                debug.innerHTML = 
                    `<span class="ok">✅ Красная область найдена!</span>\n` +
                    `📐 left: ${leftPercent.toFixed(2)}%  top: ${topPercent.toFixed(2)}%\n` +
                    `📐 width: ${widthPercent.toFixed(2)}%  height: ${heightPercent.toFixed(2)}%\n` +
                    `🖼️ ${redArea.width}×${redArea.height}px (в PNG) | ${redArea.pixels} красных пикселей`;

                console.log('✅ Красная область найдена!');
                console.log(`left: ${leftPercent.toFixed(2)}%`);
                console.log(`top: ${topPercent.toFixed(2)}%`);
                console.log(`width: ${widthPercent.toFixed(2)}%`);
                console.log(`height: ${heightPercent.toFixed(2)}%`);

                // Сохраняем для ресайза
                lastRedArea = redArea;
                lastImgWidth = imgWidth;
                lastImgHeight = imgHeight;
            }

            function processImage() {
                if (!img.complete || img.naturalWidth === 0) {
                    debug.innerHTML = '⏳ Загрузка изображения...';
                    setTimeout(processImage, 200);
                    return;
                }

                const imgWidth = img.naturalWidth;
                const imgHeight = img.naturalHeight;

                // Анализируем картинку
                analysisCanvas.width = imgWidth;
                analysisCanvas.height = imgHeight;
                analysisCtx.clearRect(0, 0, imgWidth, imgHeight);
                analysisCtx.drawImage(img, 0, 0, imgWidth, imgHeight);

                const imageData = analysisCtx.getImageData(0, 0, imgWidth, imgHeight);
                const redArea = findRedArea(imageData, imgWidth, imgHeight);

                if (!redArea) {
                    debug.innerHTML = 
                        `<span class="err">❌ Красная область не найдена!</span>\n` +
                        `Убедись, что экран залит ярко-КРАСНЫМ (#FF0000)`;
                    
                    const display = getImageDisplayRect();
                    canvas.width = display.containerWidth;
                    canvas.height = display.containerHeight;
                    ctx.fillStyle = 'rgba(255,0,0,0.1)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.strokeStyle = '#FF0000';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    const margin = 20;
                    ctx.strokeRect(margin, margin, canvas.width - margin * 2, canvas.height - margin * 2);
                    ctx.setLineDash([]);
                    return;
                }

                drawOverlay(redArea, imgWidth, imgHeight);
            }

            function handleResize() {
                if (!lastRedArea) {
                    processImage();
                    return;
                }
                drawOverlay(lastRedArea, lastImgWidth, lastImgHeight);
            }

            // === ЗАПУСК ===
            if (img.complete) {
                setTimeout(processImage, 100);
            } else {
                img.addEventListener('load', function() {
                    setTimeout(processImage, 100);
                });
            }

            img.addEventListener('error', function() {
                debug.innerHTML = '<span class="err">❌ Ошибка загрузки df.png!\nПроверь путь к файлу.</span>';
            });

            let resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(handleResize, 100);
            });

            window.addEventListener('orientationchange', function() {
                setTimeout(handleResize, 400);
            });

            setTimeout(processImage, 3000);
        })();
    </script>
</body>
</html>
